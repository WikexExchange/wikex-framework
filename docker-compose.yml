  # =============================================================================
  # Core Services
  # =============================================================================

  # Gateway Service (API Gateway)
  gateway:
    build:
      context: .
      target: gateway
    image: wikex/gateway:latest
    container_name: wikex-gateway
    ports:
      - "8080:8080"
    depends_on:
      - nacos
    logging: *default-logging
    networks:
      - wikex-network
    restart: unless-stopped

  # Exchange Service
  exchange-service:
    build:
      context: .
      target: exchange-service
    image: wikex/exchange-service:latest
    container_name: wikex-exchange-service
    ports:
      - "8084:8084"
    depends_on:
      - nacos
      - mysql
      - redis
    logging: *default-logging
    networks:
      - wikex-network
    restart: unless-stopped

  # Market Service
  market-service:
    build:
      context: .
      target: market-service
    image: wikex/market-service:latest
    container_name: wikex-market-service
    ports:
      - "8082:8082"
    depends_on:
      - nacos
      - mysql
      - redis
    logging: *default-logging
    networks:
      - wikex-network
    restart: unless-stopped

  # Match Services (Multiple instances for load balancing)
  match0-service:
    build:
      context: .
      target: match-service
    image: wikex/match-service:latest
    container_name: wikex-match0-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: match0
    depends_on:
      - nacos
      - mysql
      - redis
    logging: *default-logging
    networks:
      - wikex-network
    restart: unless-stopped

  match1-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: match-service
    image: wikex/match-service:latest
    container_name: wikex-match1-service
    ports:
      - "8103:8083"
    environment:
      SPRING_PROFILES_ACTIVE: match1
    depends_on:
      - nacos
      - mysql
      - redis
    logging: *default-logging
    networks:
      - wikex-network
    restart: unless-stopped

  match2-service:
    build:
      context: .
      dockerfile: Dockerfile
