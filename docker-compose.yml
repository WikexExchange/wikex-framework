# =============================================================================
# Wikex Platform - Complete Deployment
# Single command deployment: docker-compose up -d
# Ensures all services run within the same Docker network
# =============================================================================

# Global logging configuration template
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

